name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CharaLog.csproj

      - name: Publish (Release)
        run: dotnet publish CharaLog.csproj -c Release -o publish_output --nologo

      - name: Prepare for GitHub Pages (project site)
        run: |
          set -e
          PUB_DIR="publish_output/wwwroot"
          FW_DIR="$PUB_DIR/_framework"

          # GitHub Pages のプロジェクトサイトは https://<user>.github.io/<repo>/ 配下になるため
          # base href をリポジトリ名に合わせて書き換える（ローカル開発時は "/" のまま使えるようにするための後処理）
          sed -i 's#<base href="/" />#<base href="/CharaLog/" />#' "$PUB_DIR/index.html"

          # フィンガープリント(ハッシュ付きファイル名)が有効な場合、blazor.webassembly.js /
          # dotnet.js / dotnet.native.js / dotnet.runtime.js はビルドのたびに実際のファイル名が
          # 変わる。index.html はこれらをプレーンな名前で参照している(script src とその内部の
          # 動的 import)ため、実際に生成されたファイル名を調べて対応付ける。
          find_hashed() {
            find "$FW_DIR" -maxdepth 1 -type f | xargs -n1 basename | grep -E "$1" | head -n 1
          }

          BLAZOR_JS=$(find_hashed '^blazor\.webassembly\.[^.]+\.js$')
          DOTNET_JS=$(find_hashed '^dotnet\.[^.]+\.js$')
          DOTNET_NATIVE_JS=$(find_hashed '^dotnet\.native\.[^.]+\.js$')
          DOTNET_RUNTIME_JS=$(find_hashed '^dotnet\.runtime\.[^.]+\.js$')

          echo "blazor.webassembly.js -> ${BLAZOR_JS:-<not found>}"
          echo "dotnet.js             -> ${DOTNET_JS:-<not found>}"
          echo "dotnet.native.js      -> ${DOTNET_NATIVE_JS:-<not found>}"
          echo "dotnet.runtime.js     -> ${DOTNET_RUNTIME_JS:-<not found>}"

          if [ -z "$BLAZOR_JS" ] || [ -z "$DOTNET_JS" ] || [ -z "$DOTNET_NATIVE_JS" ] || [ -z "$DOTNET_RUNTIME_JS" ]; then
            echo "::error::Could not resolve one or more fingerprinted framework loader files."
            exit 1
          fi

          # <script src="_framework/blazor.webassembly.js"> を実際のファイル名に置き換える
          sed -i "s#_framework/blazor\.webassembly\.js#_framework/${BLAZOR_JS}#" "$PUB_DIR/index.html"

          # blazor.webassembly.js が内部で動的 import する dotnet.js / dotnet.native.js /
          # dotnet.runtime.js をハッシュ付きファイル名に解決するための import map を挿入する
          IMPORTMAP_JSON=$(printf '{"imports":{"./_framework/dotnet.js":"./_framework/%s","./_framework/dotnet.native.js":"./_framework/%s","./_framework/dotnet.runtime.js":"./_framework/%s"}}' "$DOTNET_JS" "$DOTNET_NATIVE_JS" "$DOTNET_RUNTIME_JS")
          SNIPPET=$(printf '<script type="importmap">\n%s\n</script>' "$IMPORTMAP_JSON")

          python3 -c '
          import sys
          path, snippet = sys.argv[1], sys.argv[2]
          html = open(path, encoding="utf-8").read()
          html = html.replace("</head>", snippet + "\n</head>")
          open(path, "w", encoding="utf-8").write(html)
          ' "$PUB_DIR/index.html" "$SNIPPET"

          # 直リンクや再読み込み時に 404 にならないよう .nojekyll を配置
          touch "$PUB_DIR/.nojekyll"

      - name: Verify referenced framework files exist
        run: |
          set -e
          python3 -c '
          import re, sys, os, json

          pub_dir = sys.argv[1]
          index_path = os.path.join(pub_dir, "index.html")
          html = open(index_path, encoding="utf-8").read()

          # importmap のキー(例: "./_framework/dotnet.js")は実ファイルを指さない
          # 仮想的なモジュール指定子なので検証対象から除外し、値(実際のハッシュ付き
          # ファイル名)だけをチェック対象に加える。
          refs = set()
          importmap_match = re.search(r"<script type=\"importmap\">\s*(\{.*?\})\s*</script>", html, re.S)
          if importmap_match:
              data = json.loads(importmap_match.group(1))
              for value in data.get("imports", {}).values():
                  refs.add(value.lstrip("./"))
              html = html[:importmap_match.start()] + html[importmap_match.end():]

          refs.update(re.findall(r"_framework/[A-Za-z0-9._-]+\.(?:js|wasm)", html))

          missing = [r for r in sorted(refs) if not os.path.isfile(os.path.join(pub_dir, r))]
          if missing:
              for r in missing:
                  print("::error::index.html references missing file: " + r)
              sys.exit(1)
          print("All referenced framework files exist: " + ", ".join(sorted(refs)))
          ' "publish_output/wwwroot"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish_output/wwwroot
          publish_branch: gh-pages
          force_orphan: true
